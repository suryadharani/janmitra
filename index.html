<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanMitra — A personal space for meaningful connections</title>
    <meta name="description" content="JanMitra — A personal space for meaningful connections.">
    
    <!-- Open Graph & Social Metadata -->
    <meta property="og:title" content="JanMitra">
    <meta property="og:description" content="A personal space for meaningful connections.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://janmitra.is-cool.dev">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow bg-glow-1"></div>
    <div class="ambient-glow bg-glow-2"></div>

    <main class="landing-container">
        <header class="brand-header">
            <div class="brand-badge">
                <span class="badge-dot"></span>
                <span class="badge-text">Preview</span>
            </div>
            <h1 class="brand-title">JanMitra</h1>
            <p class="brand-tagline">A personal space for meaningful connections.</p>
        </header>

        <section class="dignified-card">
            <div class="card-inner">
                <div class="symbol-mark" aria-hidden="true">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 8v8"></path>
                        <path d="M8 12h8"></path>
                    </svg>
                </div>
                <p class="card-quote">Designed with simplicity, quiet clarity, and purpose.</p>
            </div>
        </section>

        <footer class="landing-footer">
            <p class="footer-text">&copy; JanMitra. All rights reserved.</p>
        </footer>
    </main>
</body>
</html>
